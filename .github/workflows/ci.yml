name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci_only
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENTINEL_TEST_DATABASE_URL: postgres://sentinel:sentinel_ci_only@127.0.0.1:5432/sentinel?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            services/gateway/go.sum
            simulator/go.mod

      - name: Check gateway formatting
        working-directory: services/gateway
        run: test -z "$(gofmt -l .)"

      - name: Vet gateway
        working-directory: services/gateway
        run: go vet ./...

      - name: Test gateway
        working-directory: services/gateway
        run: go test ./...

      - name: Race-test gateway
        working-directory: services/gateway
        run: go test -race ./...

      - name: Check simulator formatting
        working-directory: simulator
        run: test -z "$(gofmt -l .)"

      - name: Vet simulator
        working-directory: simulator
        run: go vet ./...

      - name: Test simulator
        working-directory: simulator
        run: go test ./...

  python:
    name: Behavioural analytics checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/requirements.txt

      - name: Test regression cleanup and shell syntax
        run: |
          bash -n scripts/phase7-final-regression.sh scripts/phase7-behaviour-smoke.sh
          python3 scripts/tests/phase7-cleanup-test.py

      - name: Install behavioural analytics dependencies
        working-directory: services/ml
        run: python -m pip install -r requirements.txt

      - name: Test behavioural analytics
        working-directory: services/ml
        run: python -m pytest -q

      - name: Evaluate synthetic baseline model
        working-directory: services/ml
        run: python -m app.evaluation

      - name: Report per-profile synthetic coverage
        working-directory: services/ml
        run: python -m app.catalogue_evaluation

  console:
    name: Analyst console checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install console dependencies
        working-directory: apps/console
        run: bun install --frozen-lockfile

      - name: Lint analyst console
        working-directory: apps/console
        run: bun run lint

      - name: Test analyst API clients
        working-directory: apps/console
        run: bun test lib/sentinel/client-monitor.test.ts lib/sentinel/client-catalogue.test.ts 'app/api/sentinel/[...path]/route.test.ts'

      - name: Build analyst console
        working-directory: apps/console
        run: bun run build
