name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            services/gateway/go.sum
            simulator/go.mod

      - name: Check gateway formatting
        working-directory: services/gateway
        run: test -z "$(gofmt -l .)"

      - name: Vet gateway
        working-directory: services/gateway
        run: go vet ./...

      - name: Test gateway
        working-directory: services/gateway
        run: go test ./...

      - name: Race-test gateway
        working-directory: services/gateway
        run: go test -race ./...

      - name: Check simulator formatting
        working-directory: simulator
        run: test -z "$(gofmt -l .)"

      - name: Vet simulator
        working-directory: simulator
        run: go vet ./...

      - name: Test simulator
        working-directory: simulator
        run: go test ./...
