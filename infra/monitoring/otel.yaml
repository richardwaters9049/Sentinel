receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  file:
    path: /var/lib/otel/traces.json
    rotation:
      max_megabytes: 10
      max_backups: 3
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]
