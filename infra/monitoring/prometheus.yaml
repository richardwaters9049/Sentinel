global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: sentinel-gateway
    metrics_path: /api/v1/platform/metrics
    authorization:
      type: Bearer
      credentials_file: /run/sentinel/metrics-token
    static_configs:
      - targets: [gateway:8080]
